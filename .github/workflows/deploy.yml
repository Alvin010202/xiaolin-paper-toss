# 推送到 main 分支后自动测试、构建并发布到 GitHub Pages。
# 首次使用：仓库 Settings → Pages → Source 选择 “GitHub Actions”。
# 可选：在仓库 Settings → Secrets and variables → Actions → Variables 中设置 PUBLIC_URL（正式网址），
#       成绩卡和“复制链接”会使用它；不设置时使用访问时的页面地址。
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
